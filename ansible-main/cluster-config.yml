---
# ============================================================
# Cluster Configuration
# ============================================================
# Edit this file for your cluster, then run:
#   python3 generate-inventory.py [config-file]
# to generate inventory/hosts.yml and group_vars/all.yml
# ============================================================

cluster_name: lap-k8s

# --- SSH Credentials ---
ssh_user: root
ssh_password: toor
# ssh_key_file: ~/.ssh/id_rsa  # uncomment to use key-based auth instead

# --- Nodes ---
masters:
  - hostname: lap-k8s-master-01
    ip: 192.168.0.150

workers:
  - hostname: lap-k8s-worker-01
    ip: 192.168.0.151
  - hostname: lap-k8s-worker-02
    ip: 192.168.0.152

# --- Kubernetes ---
k8s_version: "1.35"
k8s_full_version: "v1.35.0"
pod_network_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# --- Container Runtime ---
pause_image: "registry.k8s.io/pause:3.10.1"

# --- Components (toggle on/off) ---
components:
  calico:
    enabled: true
    version: "v3.29.0"
  metallb:
    enabled: true
    version: "v0.14.5"
    ip_range: "192.168.0.160-192.168.0.199"
  istio:
    enabled: true
    version: "1.28.2"
  longhorn:
    enabled: true
