---
- name: Download Istio {{ istio_version }}
  shell: |
    cd /root && curl -L https://istio.io/downloadIstio | ISTIO_VERSION={{ istio_version }} sh -
  args:
    creates: /root/istio-{{ istio_version }}

- name: Copy istioctl to PATH
  copy:
    src: /root/istio-{{ istio_version }}/bin/istioctl
    dest: /usr/local/bin/istioctl
    remote_src: yes
    mode: '0755'

- name: Install Istio with demo profile (no gateways)
  command: >
    istioctl install
    -f /root/istio-{{ istio_version }}/samples/bookinfo/demo-profile-no-gateways.yaml
    -y
  register: istio_install
  changed_when: "'installed' in istio_install.stdout or 'created' in istio_install.stdout"

- name: Label default namespace for Istio injection
  command: kubectl label namespace default istio-injection=enabled --overwrite
  changed_when: false

- name: Install Gateway API CRDs
  shell: |
    kubectl get crd gateways.gateway.networking.k8s.io &>/dev/null || \
    kubectl kustomize "github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.4.0" | kubectl apply -f -
  register: gateway_crd_result
  changed_when: "'created' in gateway_crd_result.stdout"

- name: Wait for Istio control plane to be ready
  shell: |
    kubectl -n istio-system get pods -l app=istiod -o jsonpath='{.items[0].status.phase}'
  register: istiod_status
  retries: 30
  delay: 10
  until: istiod_status.stdout == "Running"
  changed_when: false
