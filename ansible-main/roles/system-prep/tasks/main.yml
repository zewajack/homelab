---
- name: Wait for apt locks to be released
  shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
  changed_when: false

- name: Disable unattended-upgrades if present
  shell: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    systemctl disable unattended-upgrades 2>/dev/null || true
  changed_when: false

- name: Fix interrupted dpkg if needed
  command: dpkg --configure -a
  changed_when: false

- name: Install package prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Disable swap
  command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '#\1'

- name: Remove swap file to free disk space
  file:
    path: /swap.img
    state: absent

- name: Clean apt cache to free disk space
  apt:
    autoclean: yes

- name: Load kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

- name: Configure sysctl for Kubernetes
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables=1
      net.ipv4.ip_forward=1
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'

- name: Apply sysctl settings
  command: sysctl --system
  changed_when: false
