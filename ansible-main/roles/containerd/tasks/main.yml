---
- name: Install containerd and CNI plugins
  apt:
    name:
      - containerd
      - containernetworking-plugins
    state: present
    update_cache: yes

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Set CRI sandbox image
  shell: sed -i 's|sandbox_image = ".*"|sandbox_image = "{{ pause_image }}"|' /etc/containerd/config.toml

- name: Enable SystemdCgroup
  shell: sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml

- name: Restart and enable containerd
  systemd:
    name: containerd
    state: restarted
    enabled: yes
